[workspace]
members = ["crates/scap-core", "crates/scap-raft-store", "crates/scap-raft-driver", "crates/scap-raft-rocks"]
exclude = ["experiments/wal-gate", "experiments/raft-rpc", "experiments/raft-store", "experiments/raft-cluster"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
