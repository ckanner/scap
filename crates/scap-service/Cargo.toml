[package]
name = "scap-service"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scap-sql = { path = "../scap-sql" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.50.0", features = ["sync", "time"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"
sha2 = "=0.10.9"

[dev-dependencies]
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"

[lints]
workspace = true
