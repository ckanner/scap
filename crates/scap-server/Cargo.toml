[package]
name = "scap-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scap-service = { path = "../scap-service" }
scap-archive = { path = "../scap-archive" }
scap-cell = { path = "../scap-cell" }
scap-cell-client = { path = "../scap-cell-client" }
scap-sql-worker = { path = "../scap-sql-worker" }
scap-sqlite = { path = "../scap-sqlite" }
scap-sql = { path = "../scap-sql" }
scap-engine = { path = "../scap-engine" }
scap-raft-driver = { path = "../scap-raft-driver" }
scap-raft-store = { path = "../scap-raft-store" }
scap-raft-rocks = { path = "../scap-raft-rocks" }
scap-raft-runtime = { path = "../scap-raft-runtime" }
scap-raft-transport = { path = "../scap-raft-transport" }
scap-raft-wire = { path = "../scap-raft-wire" }
raft = { git = "https://github.com/tikv/raft-rs", rev = "ad13f3d90780f53aea2488c6a4b76c0d334bf136", default-features = false, features = ["protobuf-codec"] }
sha2 = "=0.10.9"
serde_json = "=1.0.145"
reqwest = { version = "=0.13.2", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
getrandom = "=0.3.4"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
parking_lot = "=0.12.5"
slog = "=2.8.2"

[dev-dependencies]
scap-core = { path = "../scap-core" }
tokio = { version = "=1.50.0", features = ["test-util"] }
rcgen = "=0.13.2"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"

[lints]
workspace = true
