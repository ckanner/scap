[package]
name = "scap-object-store"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "=0.3.34"
bytes = "=1.12.1"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "time"] }
async-trait = "=0.1.92"
http = "=1.5.0"
quick-xml = "=0.41.0"

[dev-dependencies]
tokio = { version = "=1.50.0", features = ["test-util"] }

[lints]
workspace = true
