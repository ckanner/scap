[package]
name = "scap-raft-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Bounded mTLS peer transport; reception is never Raft commitment"

[dependencies]
scap-raft-wire = { path = "../scap-raft-wire" }
prost = "=0.14.3"
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-prost = "=0.14.6"
tokio = { version = "=1.50.0", features = ["net", "sync", "time", "io-util"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = "=0.13.2"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "test-util"] }
http-body-util = "=0.1.5"

[lints]
workspace = true
