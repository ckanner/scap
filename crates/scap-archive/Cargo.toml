[package]
name = "scap-archive"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scap-cell = { path = "../scap-cell" }
scap-cell-client = { path = "../scap-cell-client" }
scap-raft-store = { path = "../scap-raft-store" }
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "=0.3.34"
bytes = "=1.12.1"
tokio = { version = "=1.50.0", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "=1.50.0", features = ["rt-multi-thread"] }
scap-core = { path = "../scap-core" }
scap-raft-driver = { path = "../scap-raft-driver" }
scap-raft-runtime = { path = "../scap-raft-runtime" }
raft = { git = "https://github.com/tikv/raft-rs", rev = "ad13f3d90780f53aea2488c6a4b76c0d334bf136", default-features = false, features = ["protobuf-codec"] }

[lints]
workspace = true
