[package]
name = "scap-raft-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scap-raft-driver = { path = "../scap-raft-driver" }
scap-raft-store = { path = "../scap-raft-store" }
scap-raft-wire = { path = "../scap-raft-wire" }
scap-raft-transport = { path = "../scap-raft-transport" }
raft = { git = "https://github.com/tikv/raft-rs", rev = "ad13f3d90780f53aea2488c6a4b76c0d334bf136", default-features = false, features = ["protobuf-codec"] }
protobuf = "=2.28.0"
parking_lot = "=0.12.5"
tokio = { version = "=1.50.0", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
slog = "=2.8.2"
rcgen = "=0.13.2"

[lints]
workspace = true
