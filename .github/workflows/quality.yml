name: Code quality and G0 evidence

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-unit:
    name: Rust unit coverage 100 percent
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native adapter build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly-2025-09-18 --profile minimal --component llvm-tools-preview
          cargo +1.90.0 install cargo-llvm-cov --version 0.6.21 --locked
      - name: Format and lint production code
        run: |
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Collect a fresh unit-only profile
        run: |
          mkdir -p target/coverage
          cargo +nightly-2025-09-18 llvm-cov clean --workspace
          cargo +nightly-2025-09-18 llvm-cov --workspace --lib --bins --all-features --locked --branch --no-cfg-coverage --no-cfg-coverage-nightly --json --output-path target/coverage/unit.json
          python3 scripts/check_unit_coverage.py target/coverage/unit.json
      - name: Retain exact coverage counters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-unit-coverage
          path: target/coverage/unit.json
          if-no-files-found: error

  tooling-unit:
    name: Tooling unit coverage 100 percent
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COVERAGE_FILE: target/coverage/tooling.coverage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed coverage tool
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test the repository gates themselves
        run: |
          mkdir -p target/coverage
          .venv/bin/python -m coverage erase
          .venv/bin/python -m coverage run --branch --source=scripts -m unittest discover -s tests/tooling
          .venv/bin/python -m coverage report --show-missing --fail-under=100
          .venv/bin/python -m coverage json -o target/coverage/tooling.json
      - name: Retain tooling coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-unit-coverage
          path: target/coverage/tooling.json
          if-no-files-found: error

  engine-probe:
    name: Real libSQL WAL probes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Check probe formatting
        run: cargo +1.90.0 fmt --manifest-path experiments/wal-gate/Cargo.toml --all -- --check
      - name: Execute engine and process-exit experiments separately
        run: cargo +1.90.0 test --manifest-path experiments/wal-gate/Cargo.toml --locked -- --test-threads=1

  rpc-codec-probe:
    name: Real raft-rs Tonic codec probes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check probe format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/raft-rpc/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/raft-rpc/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute real loopback RPC experiments separately
        run: cargo +1.90.0 test --manifest-path experiments/raft-rpc/Cargo.toml --locked -- --test-threads=1

  durable-store-probe:
    name: Real RawNode RocksDB recovery probes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check durable probe format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/raft-store/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/raft-store/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute disk and process-recovery contracts separately
        run: cargo +1.90.0 test --manifest-path experiments/raft-store/Cargo.toml --locked -- --test-threads=1

  three-process-probe:
    name: Real three-process Raft fault contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      SCAP_CLUSTER_EVIDENCE_DIR: ${{ github.workspace }}/target/evidence/raft-cluster
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check cluster probe format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/raft-cluster/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/raft-cluster/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute three-process fault contracts separately
        run: cargo +1.90.0 test --manifest-path experiments/raft-cluster/Cargo.toml --locked -- --test-threads=1
      - name: Retain bounded request and recovery histories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: three-process-raft-evidence
          path: target/evidence/raft-cluster
          if-no-files-found: warn

  sqlite-cell-probe:
    name: Real SQLite cell commit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      SCAP_SQLITE_CELL_EVIDENCE_DIR: ${{ github.workspace }}/target/evidence/sqlite-cell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check SQLite cell probe format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/sqlite-cell/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/sqlite-cell/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute real engine and cell contracts separately
        run: cargo +1.90.0 test --manifest-path experiments/sqlite-cell/Cargo.toml --locked -- --test-threads=1
      - name: Retain engine publication and recovery histories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlite-cell-evidence
          path: target/evidence/sqlite-cell
          if-no-files-found: warn

  sqlite-engine-probe:
    name: Formal SQLite adapter fault contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      SCAP_ENGINE_EVIDENCE_DIR: ${{ github.workspace }}/target/evidence/sqlite-engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check formal adapter contract format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/sqlite-engine/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/sqlite-engine/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute formal adapter and real cell fault contracts separately
        run: cargo +1.90.0 test --manifest-path experiments/sqlite-engine/Cargo.toml --locked -- --test-threads=1
      - name: Retain engine publication and recovery histories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlite-engine-evidence
          path: target/evidence/sqlite-engine
          if-no-files-found: warn

  raft-network-probe:
    name: Real three-process mTLS runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      SCAP_NETWORK_EVIDENCE_DIR: ${{ github.workspace }}/target/evidence/raft-network
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check real network contract format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/raft-network/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/raft-network/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute real mTLS process contracts separately
        run: cargo +1.90.0 test --manifest-path experiments/raft-network/Cargo.toml --locked -- --test-threads=1
      - name: Verify all eight network histories completed
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          directory = Path(os.environ["SCAP_NETWORK_EVIDENCE_DIR"])
          histories = sorted(directory.glob("*.log"))
          if len(histories) != 8:
              raise SystemExit(f"Expected eight network histories, found {len(histories)}")
          for history in histories:
              lines = history.read_text(encoding="utf-8").splitlines()
              if not lines or not lines[-1].endswith(" verification passed"):
                  raise SystemExit(f"Incomplete network history: {history.name}")
          print("Verified eight completed network histories; execution success remains a separate test gate.")
          PY
      - name: Retain bounded network and process histories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raft-network-evidence
          path: target/evidence/raft-network
          if-no-files-found: warn

  sqlite-network-probe:
    name: Real SQLite and mTLS durable commit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      SCAP_SQL_NETWORK_EVIDENCE_DIR: ${{ github.workspace }}/target/evidence/sqlite-network
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check SQLite network contract format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/sqlite-network/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/sqlite-network/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute real SQL and mTLS process contracts separately
        run: cargo +1.90.0 test --manifest-path experiments/sqlite-network/Cargo.toml --locked -- --test-threads=1
      - name: Verify all seven SQLite network histories completed
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          directory = Path(os.environ["SCAP_SQL_NETWORK_EVIDENCE_DIR"])
          histories = sorted(directory.glob("*.log"))
          if len(histories) != 7:
              raise SystemExit(f"Expected seven SQL network histories, found {len(histories)}")
          for history in histories:
              lines = history.read_text(encoding="utf-8").splitlines()
              if not lines or not lines[-1].endswith(" verification passed"):
                  raise SystemExit(f"Incomplete SQL network history: {history.name}")
          print("Verified seven completed SQL network histories; test success is a separate gate.")
          PY
      - name: Retain SQL commit and recovery histories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlite-network-evidence
          path: target/evidence/sqlite-network
          if-no-files-found: warn
