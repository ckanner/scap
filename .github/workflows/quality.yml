          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check durable probe format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/raft-store/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/raft-store/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute disk and process-recovery contracts separately
        run: cargo +1.90.0 test --manifest-path experiments/raft-store/Cargo.toml --locked -- --test-threads=1

  three-process-probe:
    name: Real three-process Raft fault contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      SCAP_CLUSTER_EVIDENCE_DIR: ${{ github.workspace }}/target/evidence/raft-cluster
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
