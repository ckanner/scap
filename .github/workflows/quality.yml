name: Object-native quality and independent evidence

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-unit:
    name: Rust unit coverage 100 percent
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/rust-unit
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native adapter build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly-2025-09-18 --profile minimal --component llvm-tools-preview
          cargo +1.90.0 install cargo-llvm-cov --version 0.6.21 --locked
      - name: Format and lint production code
        run: |
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Collect a fresh unit-only profile
        run: |
          mkdir -p target/coverage
          cargo +nightly-2025-09-18 llvm-cov clean --workspace
          cargo +nightly-2025-09-18 llvm-cov --workspace --lib --bins --all-features --locked --branch --no-cfg-coverage --no-cfg-coverage-nightly --json --output-path target/coverage/unit.json -- --test-threads=1
          python3 scripts/check_unit_coverage.py target/coverage/unit.json
      - name: Retain exact coverage counters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-unit-coverage
          path: target/coverage/unit.json
          if-no-files-found: error

  tooling-unit:
    name: Tooling unit coverage 100 percent
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COVERAGE_FILE: target/coverage/tooling.coverage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed coverage tool
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test the repository gates themselves
        run: |
          mkdir -p target/coverage
          .venv/bin/python -m coverage erase
          .venv/bin/python -m coverage run --branch --source=scripts -m unittest discover -s tests/tooling
          .venv/bin/python -m coverage report --show-missing --fail-under=100
          .venv/bin/python -m coverage json -o target/coverage/tooling.json
      - name: Retain tooling coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-unit-coverage
          path: target/coverage/tooling.json
          if-no-files-found: error

  object-authority-model:
    name: N0 bounded model and independent oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run protocol and negative-oracle unit tests
        run: python3 -m unittest discover -s experiments/object-authority-model -p 'test_*.py' -v
      - name: Explore bounded schedules and retain raw histories
        run: python3 experiments/object-authority-model/explore.py --output "$GITHUB_WORKSPACE/target/evidence/object-authority-model"
      - name: Explore named catalogue publication races and negative controls
        run: python3 experiments/object-authority-model/named_catalogue_model.py --output "$GITHUB_WORKSPACE/target/evidence/named-catalogue-model"
      - name: Check the terminal retirement model and independent observer
        run: python3 -m unittest discover -s experiments/object-terminal-retirement-model -p 'test_*.py' -v
      - name: Explore terminal retirement schedules without claiming product acceptance
        run: python3 experiments/object-terminal-retirement-model/explore.py --out "$GITHUB_WORKSPACE/target/evidence/terminal-retirement-model"
      - name: Check accepted owner plans and the independent raw-history observer
        run: python3 -B -m unittest discover -s experiments/object-owner-plan-model -p 'test_*.py' -v
      - name: Explore accepted owner schedules with original in-flight requests
        run: python3 -B experiments/object-owner-plan-model/explore.py --output "$GITHUB_WORKSPACE/target/evidence/owner-plan-model"
      - name: Retain model evidence without claiming real S3 execution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: object-authority-model
          path: |
            target/evidence/object-authority-model
            target/evidence/named-catalogue-model
            target/evidence/terminal-retirement-model
            target/evidence/owner-plan-model
          if-no-files-found: warn

  resource-limits:
    name: Actual resource lifetimes and conditional GC transport
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/resource-check
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed native and Rust tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Fetch the pinned private local S3 backend
        run: |
          mkdir "$RUNNER_TEMP/scap-resource-tools"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.51/linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/scap-resource-tools/weed.tar.gz"
          echo "c03be37416a8ee672c77766e20b22a4e1430744c3af2668599a4b6eeaec14cee  $RUNNER_TEMP/scap-resource-tools/weed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/scap-resource-tools/weed.tar.gz" -C "$RUNNER_TEMP/scap-resource-tools" weed
          "$RUNNER_TEMP/scap-resource-tools/weed" version
      - name: Check experiment code and audit controls
        run: |
          python3 -m unittest discover -s experiments/object-gc-store -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/resource-limits -p 'test_*.py' -v
          cargo +1.90.0 fmt --manifest-path experiments/object-gc-store/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/object-gc-store/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.90.0 fmt --manifest-path experiments/resource-limits/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/resource-limits/Cargo.toml --all-targets --locked -- -D warnings
      - name: Freeze and verify actual HTTP TCP S3 resource lifetimes
        # A paused object read is an explicit fixture seam, not production logic.
        run: |
          mkdir "$RUNNER_TEMP/scap-resource-evidence"
          python3 experiments/resource-limits/build.py --target "$RUNNER_TEMP/scap-resource-release" \
            --evidence "$RUNNER_TEMP/scap-resource-evidence/resource-build"
          python3 experiments/resource-limits/run.py \
            --worker "$RUNNER_TEMP/scap-resource-release/release/scap-resource-limits" \
            --build "$RUNNER_TEMP/scap-resource-evidence/resource-build/build.json" \
            --weed "$RUNNER_TEMP/scap-resource-tools/weed" \
            --evidence "$RUNNER_TEMP/scap-resource-evidence/resource-limits"
          python3 experiments/resource-limits/oracle.py "$RUNNER_TEMP/scap-resource-evidence/resource-limits" \
            > "$RUNNER_TEMP/scap-resource-evidence/resource-oracle.json"
          python3 experiments/resource-limits/controls.py "$RUNNER_TEMP/scap-resource-evidence/resource-limits" \
            > "$RUNNER_TEMP/scap-resource-evidence/resource-controls.json"
      - name: Verify conditional deletion on the composed source
        # This job checks the restricted transport; product GC has its own raw-history gate.
        run: |
          python3 experiments/object-gc-store/build.py --target "$RUNNER_TEMP/scap-gc-release" \
            --evidence "$RUNNER_TEMP/scap-resource-evidence/gc-build"
          python3 experiments/object-gc-store/run.py \
            --worker "$RUNNER_TEMP/scap-gc-release/release/scap-object-gc-store" \
            --build-receipt "$RUNNER_TEMP/scap-resource-evidence/gc-build/build.json" \
            --weed "$RUNNER_TEMP/scap-resource-tools/weed" \
            --evidence "$RUNNER_TEMP/scap-resource-evidence/gc-store"
      - name: Retain resource evidence without claiming AWS acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resource-limits-local-s3
          path: |
            ${{ runner.temp }}/scap-resource-evidence/resource-build/**
            ${{ runner.temp }}/scap-resource-evidence/resource-limits/**
            ${{ runner.temp }}/scap-resource-evidence/resource-oracle.json
            ${{ runner.temp }}/scap-resource-evidence/resource-controls.json
            ${{ runner.temp }}/scap-resource-evidence/gc-build/**
            ${{ runner.temp }}/scap-resource-evidence/gc-store/**
          if-no-files-found: warn

  object-network:
    name: Real local S3 HTTP and process recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/object-network-build
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build tools and fixed Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          c++ --version
          dpkg-query --show libclang-18-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Fetch the pinned local S3-compatible server
        run: |
          mkdir -p target/object-network-tools
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.51/linux_amd64.tar.gz \
            --output target/object-network-tools/weed.tar.gz
          echo 'c03be37416a8ee672c77766e20b22a4e1430744c3af2668599a4b6eeaec14cee  target/object-network-tools/weed.tar.gz' | sha256sum --check --strict
          tar -xzf target/object-network-tools/weed.tar.gz -C target/object-network-tools weed
          target/object-network-tools/weed version
      - name: Check semantic-result fault fixture controls (not native acceptance)
        run: |
          python3 -m unittest discover -s experiments/object-network -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/object-service -p 'test_*.py' -v
          python3 -B -m unittest discover -s experiments/object-metadata -p 'test_*.py' -v
          python3 -B -m unittest discover -s experiments/guarded-status -p 'test_*.py' -v
          python3 -B -m unittest discover -s experiments/output-pool -p 'test_*.py' -v
          python3 -B -m unittest discover -s experiments/bounded-transport/response -p 'test_*.py' -v
          node --test experiments/object-service/test_client_ledger.mjs
          python3 -m unittest discover -s experiments/object-discovery -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/bounded-transport -p 'test_*.py' -v
      - name: Format, lint, and build the production-code harness
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/object-network/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/object-network/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.90.0 fmt --manifest-path experiments/object-discovery/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/object-discovery/Cargo.toml --all-targets --locked -- -D warnings
          python3 experiments/object-network/build.py \
            --target-dir "$CARGO_TARGET_DIR" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/object-network-build"
      - name: Verify bounded LIST and single-attempt signed HTTP
        run: |
          python3 experiments/object-network/listing_build.py \
            --target-dir "$CARGO_TARGET_DIR" --release \
            --evidence "$GITHUB_WORKSPACE/target/evidence/listing-build"
          python3 experiments/object-network/listing_contract.py \
            --worker "$CARGO_TARGET_DIR/release/examples/scap-object-listing" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-receipt "$GITHUB_WORKSPACE/target/evidence/listing-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/listing"
          python3 experiments/object-network/response_contract.py \
            --worker "$CARGO_TARGET_DIR/release/examples/scap-object-listing" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-receipt "$GITHUB_WORKSPACE/target/evidence/listing-build/build.json" --bounded \
            --evidence "$GITHUB_WORKSPACE/target/evidence/response-bounds"
      - name: Run independent HTTP and process evidence
        # Private loopback services only. AWS Standard and production SLO remain NOT_RUN.
        run: |
          python3 experiments/object-network/run.py \
            --worker "$CARGO_TARGET_DIR/release/scap-object-network" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-network-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/object-network"
      - name: Reject semantically corrupt retained results with valid object hashes
        # Each entrypoint gets a fresh worker; unit profiles never enter this run.
        run: |
          python3 experiments/object-network/retained_result_contract.py \
            --worker "$CARGO_TARGET_DIR/release/scap-object-network" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-network-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/retained-result-contract"
      - name: Verify one GiB of actual default-profile data and full recovery
        # Separate release evidence; never merged into unit coverage profiles.
        run: |
          python3 experiments/object-capacity/run.py \
            --worker "$CARGO_TARGET_DIR/release/scap-object-network" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-network-build/build.json" \
            --profile gib1 \
            --evidence "$GITHUB_WORKSPACE/target/evidence/object-capacity-gib1"
      - name: Verify lifecycle races, cancellation, retirement, and owner fencing
        # Independent raw-history oracle; local S3 never stands in for AWS.
        run: |
          python3 experiments/object-network/lifecycle_contract.py \
            --worker "$CARGO_TARGET_DIR/release/scap-object-network" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-network-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/lifecycle-contract"
      - name: Verify named catalogue publication cuts and permanent identity fences
        # Exact-name recovery only; full inventory and AWS are separate gates.
        run: |
          python3 experiments/object-network/catalogue_contract.py \
            --worker "$CARGO_TARGET_DIR/release/scap-object-network" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-network-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/catalogue-contract"
      - name: Recover all physical slots from the deployment root after total compute loss
        run: |
          python3 experiments/object-discovery/discovery_build.py \
            --target-dir "$CARGO_TARGET_DIR" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/deployment-recovery-build"
          python3 experiments/object-discovery/discovery_contract.py \
            --seed-worker "$CARGO_TARGET_DIR/release/scap-object-network" \
            --seed-build "$GITHUB_WORKSPACE/target/evidence/object-network-build/build.json" \
            --worker "$CARGO_TARGET_DIR/release/scap-object-discovery" \
            --build "$GITHUB_WORKSPACE/target/evidence/deployment-recovery-build/build.json" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/deployment-recovery"
          python3 experiments/object-discovery/discovery_oracle.py \
            --evidence "$GITHUB_WORKSPACE/target/evidence/deployment-recovery" \
            > "$GITHUB_WORKSPACE/target/evidence/deployment-recovery-oracle.json"
          python3 experiments/object-discovery/discovery_controls.py \
            --evidence "$GITHUB_WORKSPACE/target/evidence/deployment-recovery" \
            > "$GITHUB_WORKSPACE/target/evidence/deployment-recovery-controls.json"
      - name: Build and verify the actual authenticated HTTP service and Node SDK
        run: |
          service_target="$GITHUB_WORKSPACE/target/object-service-build"
          python3 experiments/object-service/build.py \
            --target-dir "$service_target" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/object-service-build"
          python3 experiments/object-service/run.py \
            --server "$service_target/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/object-service"
      - name: Verify actual connection and HTTP header limits
        run: |
          python3 experiments/bounded-transport/run.py \
            --binary "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --evidence "$RUNNER_TEMP/scap-bounded-transport"
          python3 experiments/bounded-transport/oracle.py \
            "$RUNNER_TEMP/scap-bounded-transport/observations.json" \
            > "$RUNNER_TEMP/scap-bounded-transport-oracle.json"
      - name: Verify owner routing and fixed takeover intents under real faults
        # One source-bound daemon binary; private credentials stay outside evidence.
        run: |
          python3 experiments/object-service/owner_contract.py \
            --server "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --evidence "$RUNNER_TEMP/scap-owner-evidence/owner"
          python3 experiments/object-service/owner_oracle.py \
            --evidence "$RUNNER_TEMP/scap-owner-evidence/owner" \
            > "$RUNNER_TEMP/scap-owner-evidence/oracle.json"
          python3 experiments/object-service/owner_controls.py \
            --evidence "$RUNNER_TEMP/scap-owner-evidence/owner" \
            --output "$RUNNER_TEMP/scap-owner-evidence/controls"
      - name: Verify guarded status across an actual endpoint replacement
        run: |
          python3 -B experiments/guarded-status/run.py \
            --server "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --evidence "$RUNNER_TEMP/scap-guarded-evidence/run"
          python3 -B experiments/guarded-status/oracle.py \
            --evidence "$RUNNER_TEMP/scap-guarded-evidence/run" \
            --output "$RUNNER_TEMP/scap-guarded-evidence/oracle.json"
          python3 -B experiments/guarded-status/controls.py \
            --evidence "$RUNNER_TEMP/scap-guarded-evidence/run" \
            --output "$RUNNER_TEMP/scap-guarded-evidence/controls"
      - name: Verify output budgets with real slow clients and original-result lookup
        run: |
          python3 -B experiments/output-pool/run.py \
            --source-root "$GITHUB_WORKSPACE" \
            --server "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --transport-profile bounded --evidence "$RUNNER_TEMP/scap-output-evidence/run"
          python3 -B experiments/output-pool/oracle.py "$RUNNER_TEMP/scap-output-evidence/run" \
            > "$RUNNER_TEMP/scap-output-evidence/oracle.json"
          python3 -B experiments/output-pool/controls.py "$RUNNER_TEMP/scap-output-evidence/run" \
            > "$RUNNER_TEMP/scap-output-evidence/controls.json"
      - name: Verify response expiry and bounded connection shutdown over actual TCP
        run: |
          python3 -B experiments/bounded-transport/response/run.py \
            --source-root "$GITHUB_WORKSPACE" \
            --server "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --evidence "$RUNNER_TEMP/scap-response-evidence/run"
          python3 -B experiments/bounded-transport/response/oracle.py "$RUNNER_TEMP/scap-response-evidence/run" \
            > "$RUNNER_TEMP/scap-response-evidence/oracle.json"
          python3 -B experiments/bounded-transport/response/controls.py "$RUNNER_TEMP/scap-response-evidence/run" \
            > "$RUNNER_TEMP/scap-response-evidence/controls.json"
      - name: Verify management HEAD-only I/O and exact original publication outcomes
        # Separate dedicated M listener; no timestamp-based shared S3 attribution.
        run: |
          python3 -B experiments/object-metadata/run.py \
            --server "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --evidence "$RUNNER_TEMP/scap-metadata-evidence/run"
          python3 -B experiments/object-metadata/oracle.py \
            --evidence "$RUNNER_TEMP/scap-metadata-evidence/run" \
            --output "$RUNNER_TEMP/scap-metadata-evidence/oracle.json"
          python3 -B experiments/object-metadata/controls.py \
            --evidence "$RUNNER_TEMP/scap-metadata-evidence/run" \
            --output "$RUNNER_TEMP/scap-metadata-evidence/controls.json"
      - name: Verify catalogue HTTP intents, independent admission, and recovery
        run: |
          python3 experiments/object-service/catalogue_contract.py \
            --server "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/catalogue-service"
      - name: Verify hot queries and controls while a cold database restore is blocked
        run: |
          python3 experiments/object-service/isolation_contract.py \
            --server "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/isolation-service"
          python3 experiments/object-service/isolation_controls.py \
            --evidence "$GITHUB_WORKSPACE/target/evidence/isolation-service" \
            --output "$GITHUB_WORKSPACE/target/evidence/isolation-controls"
      - name: Verify segmented request index growth and full cold integrity
        run: |
          python3 experiments/object-service/segmented_contract.py \
            --server "$GITHUB_WORKSPACE/target/object-service-build/release/scapd" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-service-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/segmented-service"
