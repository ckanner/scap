name: Code quality and G0 evidence

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-unit:
    name: Rust unit coverage 100 percent
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native adapter build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly-2025-09-18 --profile minimal --component llvm-tools-preview
          cargo +1.90.0 install cargo-llvm-cov --version 0.6.21 --locked
      - name: Format and lint production code
        run: |
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Collect a fresh unit-only profile
        run: |
          mkdir -p target/coverage
          cargo +nightly-2025-09-18 llvm-cov clean --workspace
          cargo +nightly-2025-09-18 llvm-cov --workspace --lib --bins --all-features --locked --branch --no-cfg-coverage --no-cfg-coverage-nightly --json --output-path target/coverage/unit.json -- --test-threads=1
          python3 scripts/check_unit_coverage.py target/coverage/unit.json
      - name: Retain exact coverage counters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-unit-coverage
          path: target/coverage/unit.json
          if-no-files-found: error

  tooling-unit:
    name: Tooling unit coverage 100 percent
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COVERAGE_FILE: target/coverage/tooling.coverage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed coverage tool
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test the repository gates themselves
        run: |
          mkdir -p target/coverage
          .venv/bin/python -m coverage erase
          .venv/bin/python -m coverage run --branch --source=scripts -m unittest discover -s tests/tooling
          .venv/bin/python -m coverage report --show-missing --fail-under=100
          .venv/bin/python -m coverage json -o target/coverage/tooling.json
      - name: Retain tooling coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-unit-coverage
          path: target/coverage/tooling.json
          if-no-files-found: error

  engine-probe:
    name: Real libSQL WAL probes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Check probe formatting
        run: cargo +1.90.0 fmt --manifest-path experiments/wal-gate/Cargo.toml --all -- --check
      - name: Execute engine and process-exit experiments separately
        run: cargo +1.90.0 test --manifest-path experiments/wal-gate/Cargo.toml --locked -- --test-threads=1

  rpc-codec-probe:
    name: Real raft-rs Tonic codec probes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check probe format and lint
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/raft-rpc/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/raft-rpc/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute real loopback RPC experiments separately
        run: cargo +1.90.0 test --manifest-path experiments/raft-rpc/Cargo.toml --locked -- --test-threads=1

  durable-store-probe:
    name: Real RawNode RocksDB recovery probes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
