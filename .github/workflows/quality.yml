name: Object-native quality and independent evidence

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-unit:
    name: Rust unit coverage 100 percent
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/rust-unit
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and record native adapter build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Install fixed tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly-2025-09-18 --profile minimal --component llvm-tools-preview
          cargo +1.90.0 install cargo-llvm-cov --version 0.6.21 --locked
      - name: Format and lint production code
        run: |
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Collect a fresh unit-only profile
        run: |
          mkdir -p target/coverage
          cargo +nightly-2025-09-18 llvm-cov clean --workspace
          cargo +nightly-2025-09-18 llvm-cov --workspace --lib --bins --all-features --locked --branch --no-cfg-coverage --no-cfg-coverage-nightly --json --output-path target/coverage/unit.json -- --test-threads=1
          python3 scripts/check_unit_coverage.py target/coverage/unit.json
      - name: Retain exact coverage counters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-unit-coverage
          path: target/coverage/unit.json
          if-no-files-found: error

  tooling-unit:
    name: Tooling unit coverage 100 percent
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COVERAGE_FILE: target/coverage/tooling.coverage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed coverage tool
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test the repository gates themselves
        run: |
          mkdir -p target/coverage
          .venv/bin/python -m coverage erase
          .venv/bin/python -m coverage run --branch --source=scripts -m unittest discover -s tests/tooling
          .venv/bin/python -m coverage report --show-missing --fail-under=100
          .venv/bin/python -m coverage json -o target/coverage/tooling.json
      - name: Retain tooling coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-unit-coverage
          path: target/coverage/tooling.json
          if-no-files-found: error

  object-authority-model:
    name: N0 bounded model and independent oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run protocol and negative-oracle unit tests
        run: python3 -m unittest discover -s experiments/object-authority-model -p 'test_*.py' -v
      - name: Explore bounded schedules and retain raw histories
        run: python3 experiments/object-authority-model/explore.py --output target/evidence/object-authority-model
      - name: Retain model evidence without claiming real S3 execution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: object-authority-model
          path: target/evidence/object-authority-model
          if-no-files-found: warn

  object-network:
    name: Real local S3 HTTP and process recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/object-network-build
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build tools and fixed Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          c++ --version
          dpkg-query --show libclang-18-dev
      - name: Fetch the pinned local S3-compatible server
        run: |
          mkdir -p target/object-network-tools
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.51/linux_amd64.tar.gz \
            --output target/object-network-tools/weed.tar.gz
          echo 'c03be37416a8ee672c77766e20b22a4e1430744c3af2668599a4b6eeaec14cee  target/object-network-tools/weed.tar.gz' | sha256sum --check --strict
          tar -xzf target/object-network-tools/weed.tar.gz -C target/object-network-tools weed
          target/object-network-tools/weed version
      - name: Format, lint, and build the production-code harness
        run: |
          cargo +1.90.0 fmt --manifest-path experiments/object-network/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --manifest-path experiments/object-network/Cargo.toml --all-targets --locked -- -D warnings
          python3 experiments/object-network/build.py \
            --target-dir "$CARGO_TARGET_DIR" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/object-network-build"
      - name: Run independent HTTP and process evidence
        # Private loopback services only. AWS Standard and production SLO remain NOT_RUN.
        run: |
          python3 experiments/object-network/run.py \
            --worker "$CARGO_TARGET_DIR/release/scap-object-network" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-network-build/build.json" \
            --evidence "$GITHUB_WORKSPACE/target/evidence/object-network"
      - name: Verify one GiB of actual default-profile data and full recovery
        # Separate release evidence; never merged into unit coverage profiles.
        run: |
          python3 experiments/object-capacity/run.py \
            --worker "$CARGO_TARGET_DIR/release/scap-object-network" \
            --weed "$GITHUB_WORKSPACE/target/object-network-tools/weed" \
            --build-record "$GITHUB_WORKSPACE/target/evidence/object-network-build/build.json" \
            --profile gib1 \
            --evidence "$GITHUB_WORKSPACE/target/evidence/object-capacity-gib1"
      - name: Retain public network evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: object-network-local-s3
          path: |
            target/evidence/object-network/history.jsonl
            target/evidence/object-network/summary.json
            target/evidence/object-network/ack-ledger.jsonl
            target/evidence/object-network/fault-input-ledger.jsonl
            target/evidence/object-network/fault-ack-ledger.jsonl
            target/evidence/object-network/fault-outcome-ledger.jsonl
            target/evidence/object-network/fault-cases.jsonl
            target/evidence/object-network/fault-plan.json
            target/evidence/object-network/build-receipt.json
            target/evidence/object-network-build/build.json
            target/evidence/object-network-build/cargo.stdout.jsonl
            target/evidence/object-network-build/cargo.stderr.log
            target/evidence/object-capacity-gib1/history.jsonl
            target/evidence/object-capacity-gib1/input-ledger.jsonl
            target/evidence/object-capacity-gib1/ack-ledger.jsonl
            target/evidence/object-capacity-gib1/resource-samples.jsonl
            target/evidence/object-capacity-gib1/worker-resources-*.jsonl
            target/evidence/object-capacity-gib1/summary.json
            target/evidence/object-capacity-gib1/build-receipt.json
          if-no-files-found: error
