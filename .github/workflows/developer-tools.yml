name: Developer tooling self-tests

on:
  push:
    paths: ['dev/environment/**', '.github/workflows/developer-tools.yml', 'requirements-dev.txt']
  pull_request:
    paths: ['dev/environment/**', '.github/workflows/developer-tools.yml', 'requirements-dev.txt']

permissions:
  contents: read

jobs:
  environment-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COVERAGE_FILE: target/coverage/environment.coverage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the fixed Python coverage tool
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test control logic and real shell boundaries (not Rust or Docker acceptance)
        run: |
          mkdir -p target/coverage
          bash -n dev/environment/enter.sh
          bash -n dev/environment/validate.sh
          .venv/bin/python -m coverage run --branch --source=dev/environment -m unittest discover -s dev/environment -p 'test_*.py' -v
          .venv/bin/python -m coverage json --include='*/bootstrap.py' -o target/coverage/environment.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/coverage/environment.json').read_text())
          if set(report['files']) != {'dev/environment/bootstrap.py'}:
              raise SystemExit('Missing or unexpected environment controller coverage')
          summary = report['files']['dev/environment/bootstrap.py']['summary']
          if summary['num_statements'] <= 0 or summary['num_branches'] <= 0:
              raise SystemExit('Empty coverage denominator')
          if (summary['covered_lines'] != summary['num_statements']
              or summary['covered_branches'] != summary['num_branches']
              or summary['excluded_lines'] != 0):
              raise SystemExit('Exact statement and branch coverage required; no exclusions')
          print('Controller coverage passed; Rust, Docker and S3 acceptance are separate gates.')
          PY
      - name: Retain development-tool coverage only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: environment-controller-coverage
          path: target/coverage/environment.json
          if-no-files-found: error
