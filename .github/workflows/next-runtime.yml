name: Concurrent reads, fleet reload and kernel resource contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: next-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Actual ${{ matrix.contract }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        contract: [read-pool, object-dynamic-fleet-runtime, object-overload, kernel-envelope]
    env:
      CARGO_BUILD_JOBS: 2
      CXXFLAGS: -g0
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      SCAP_CONTRACT: ${{ matrix.contract }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed native and Rust tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-18-dev
          rustup toolchain install 1.90.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Fetch pinned authenticated local S3 backend
        if: matrix.contract != 'kernel-envelope'
        run: |
          mkdir "$RUNNER_TEMP/scap-next-tools"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.51/linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/scap-next-tools/weed.tar.gz"
          echo "c03be37416a8ee672c77766e20b22a4e1430744c3af2668599a4b6eeaec14cee  $RUNNER_TEMP/scap-next-tools/weed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/scap-next-tools/weed.tar.gz" -C "$RUNNER_TEMP/scap-next-tools" weed
      - name: Check independent observers and directed counterexamples
        run: |
          python3 -B -m unittest discover -s "experiments/$SCAP_CONTRACT" -p 'test_*.py' -v
          if [ "$SCAP_CONTRACT" = object-overload ]; then
            node --test experiments/object-overload/test_schedule.mjs
          fi
      - name: Build and bind the complete current service and SDK
        run: |
          mkdir "$RUNNER_TEMP/scap-next-evidence"
          python3 -B experiments/object-service/build.py \
            --target-dir "$RUNNER_TEMP/scap-next-release" \
            --evidence "$RUNNER_TEMP/scap-next-evidence/build"
      - name: Observe the complete fixed actual contract
        run: |
          case "$SCAP_CONTRACT" in
            read-pool)
              python3 -B experiments/read-pool/run.py \
                --binary "$RUNNER_TEMP/scap-next-release/release/scapd" \
                --build-record "$RUNNER_TEMP/scap-next-evidence/build/build.json" \
                --weed "$RUNNER_TEMP/scap-next-tools/weed" --node "$(command -v node)" \
                --evidence "$RUNNER_TEMP/scap-next-evidence/run"
              ;;
            object-dynamic-fleet-runtime)
              python3 -B experiments/object-dynamic-fleet-runtime/run.py \
                --server "$RUNNER_TEMP/scap-next-release/release/scapd" \
                --build-record "$RUNNER_TEMP/scap-next-evidence/build/build.json" \
                --weed "$RUNNER_TEMP/scap-next-tools/weed" --node "$(command -v node)" \
                --evidence "$RUNNER_TEMP/scap-next-evidence/run"
              ;;
            object-overload)
              python3 -B experiments/object-overload/run.py \
                --source-root "$GITHUB_WORKSPACE" \
                --server "$RUNNER_TEMP/scap-next-release/release/scapd" \
                --build-record "$RUNNER_TEMP/scap-next-evidence/build/build.json" \
                --weed "$RUNNER_TEMP/scap-next-tools/weed" \
                --evidence "$RUNNER_TEMP/scap-next-evidence/run"
              ;;
            kernel-envelope)
              python3 -B experiments/kernel-envelope/run.py \
                --server "$RUNNER_TEMP/scap-next-release/release/scapd" \
                --build-record "$RUNNER_TEMP/scap-next-evidence/build/build.json" \
                --evidence "$RUNNER_TEMP/scap-next-evidence/run"
              ;;
            *) exit 2 ;;
          esac
      - name: Independently audit original bytes and all negative controls
        run: |
          python3 -B "experiments/$SCAP_CONTRACT/oracle.py" \
            "$RUNNER_TEMP/scap-next-evidence/run" \
            > "$RUNNER_TEMP/scap-next-evidence/oracle.json"
          arguments=("$RUNNER_TEMP/scap-next-evidence/run")
          if [ "$SCAP_CONTRACT" = object-overload ] || [ "$SCAP_CONTRACT" = kernel-envelope ]; then
            arguments+=(--output "$RUNNER_TEMP/scap-next-evidence/controls")
          fi
          python3 -B "experiments/$SCAP_CONTRACT/controls.py" "${arguments[@]}" \
            > "$RUNNER_TEMP/scap-next-evidence/controls.json"
      - name: Retain original successes and failures without claiming production SLO
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-${{ matrix.contract }}-evidence
          path: ${{ runner.temp }}/scap-next-evidence/**
          if-no-files-found: warn
