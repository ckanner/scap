[package]
name = "scap-raft-rpc-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
autobins = false
autolib = false
build = "build.rs"
description = "Research-only raft-rs bytes and Tonic transport contract probe"

[workspace]

[[test]]
name = "transport"
path = "tests/transport.rs"

[dev-dependencies]
raft = { git = "https://github.com/tikv/raft-rs", rev = "ad13f3d90780f53aea2488c6a4b76c0d334bf136", default-features = false, features = ["protobuf-codec"] }
protobuf = "=2.28.0"
prost = "=0.14.3"
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "=0.14.6"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }

[build-dependencies]
tonic-build = "=0.14.6"
tonic-prost-build = "=0.14.6"
protoc-bin-vendored = "=3.2.0"
