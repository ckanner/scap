[package]
name = "scap-object-network"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[[example]]
name = "scap-object-listing"
path = "listing_worker.rs"

[dependencies]
scap-object = { path = "../../crates/scap-object" }
scap-object-store = { path = "../../crates/scap-object-store" }
scap-sql = { path = "../../crates/scap-sql" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
