[package]
name = "scap-resource-limits"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
scap-service = { path = "../../crates/scap-service" }
scap-object = { path = "../../crates/scap-object" }
scap-object-store = { path = "../../crates/scap-object-store" }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "net", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
