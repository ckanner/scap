[package]
name = "scap-control-network-contracts"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
autobins = false
autolib = false
description = "Independent bounded control receipt and real archive fault contracts"

[workspace]
resolver = "2"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[features]
legacy-producer = []

[[test]]
name = "legacy"
path = "tests/legacy.rs"
required-features = ["legacy-producer"]

[dev-dependencies]
scap-archive = { path = "../../crates/scap-archive" }
serde_json = "=1.0.145"
scap-cell-client = { path = "../../crates/scap-cell-client" }
scap-sql-worker = { path = "../../crates/scap-sql-worker" }
scap-engine = { path = "../../crates/scap-engine" }
scap-sql = { path = "../../crates/scap-sql" }
scap-sqlite = { path = "../../crates/scap-sqlite" }
libsql-sys = { git = "https://github.com/tursodatabase/libsql", rev = "d8bc862d20bedc72945a1da27c8b7045414c0261", features = ["rusqlite"] }
scap-cell = { path = "../../crates/scap-cell" }
scap-core = { path = "../../crates/scap-core" }
scap-raft-driver = { path = "../../crates/scap-raft-driver" }
scap-raft-rocks = { path = "../../crates/scap-raft-rocks" }
scap-raft-store = { path = "../../crates/scap-raft-store" }
scap-raft-wire = { path = "../../crates/scap-raft-wire" }
scap-raft-transport = { path = "../../crates/scap-raft-transport" }
scap-raft-runtime = { path = "../../crates/scap-raft-runtime" }
raft = { git = "https://github.com/tikv/raft-rs", rev = "ad13f3d90780f53aea2488c6a4b76c0d334bf136", default-features = false, features = ["protobuf-codec"] }
protobuf = "=2.28.0"
prost = "=0.14.3"
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-prost = "=0.14.6"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
rcgen = "=0.13.2"
slog = "=2.8.2"
tempfile = "=3.27.0"

[profile.dev]
debug = 0
