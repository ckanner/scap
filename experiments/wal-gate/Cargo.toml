[package]
name = "scap-wal-gate-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Non-production probes of the pinned libSQL virtual WAL boundary"

# Keep the native engine and its dependency graph outside the product workspace.
[workspace]
resolver = "3"

[dependencies]
libsql-sys = { git = "https://github.com/tursodatabase/libsql", rev = "d8bc862d20bedc72945a1da27c8b7045414c0261", features = ["rusqlite"] }

[[bin]]
name = "wal-gate-child"
path = "src/main.rs"
test = false
bench = false
